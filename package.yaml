name: debug-tools

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-deriving-strategies
  - -Wpartial-fields
  - -Wredundant-constraints
  - -Wunused-packages
  - -Werror

executables:
  debug-args:
    main: debug-args.hs
    dependencies:
      - base
  debug-signals:
    main: debug-signals.hs
    dependencies:
      - base
      - containers
      - unix
  debug-stdin:
    main: debug-stdin.hs
    dependencies:
      - base
      - bytestring
  debug-ttys:
    main: debug-ttys.hs
    dependencies:
      - base
